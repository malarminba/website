  <line x1="210" y1="202" x2="768" y2="202" stroke="#141420" stroke-width="1"/>
  <text x="228" y="222" font-family="Inter,sans-serif" font-size="8" fill="#5050a0">WF-2841</text>
  <text x="358" y="222" font-family="Inter,sans-serif" font-size="8" fill="#7070a0">A. Reyes</text>
  <rect x="498" y="212" width="52" height="16" rx="3" fill="#0e1a0e"/>
  <text x="524" y="223" font-family="Inter,sans-serif" font-size="7" fill="#4ade80" text-anchor="middle">Done</text>
  <text x="628" y="222" font-family="Inter,sans-serif" font-size="8" fill="#38384f">Jun 12</text>
  <line x1="210" y1="234" x2="768" y2="234" stroke="#141420" stroke-width="1"/>
  <text x="228" y="254" font-family="Inter,sans-serif" font-size="8" fill="#5050a0">WF-2842</text>
  <text x="358" y="254" font-family="Inter,sans-serif" font-size="8" fill="#7070a0">K. Nair</text>
  <rect x="498" y="244" width="64" height="16" rx="3" fill="#1a120a"/>
  <text x="530" y="255" font-family="Inter,sans-serif" font-size="7" fill="#f59e0b" text-anchor="middle">Pending</text>
  <text x="628" y="254" font-family="Inter,sans-serif" font-size="8" fill="#38384f">Jun 13</text>
  <line x1="210" y1="266" x2="768" y2="266" stroke="#141420" stroke-width="1"/>
  <rect x="210" y="267" width="558" height="33" fill="#0e0e1c"/>
  <text x="228" y="287" font-family="Inter,sans-serif" font-size="8" fill="#5050a0">WF-2843</text>
  <text x="358" y="287" font-family="Inter,sans-serif" font-size="8" fill="#c0c0e0" font-weight="500">M. Iyer</text>
  <rect x="498" y="277" width="58" height="16" rx="3" fill="#1a0f2e" stroke="#6d28d9" stroke-width="0.5" filter="url(#eg)"/>
  <text x="527" y="288" font-family="Inter,sans-serif" font-size="7" fill="#a855f7" text-anchor="middle">Review</text>
  <text x="628" y="287" font-family="Inter,sans-serif" font-size="8" fill="#38384f">Jun 14</text>
