<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070e"/>
      <stop offset="100%" stop-color="#0c0c18"/>
    </linearGradient>
    <filter id="eg"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#ebg)"/>
  <!-- top bar -->
  <rect x="0" y="0" width="800" height="40" fill="#08080e" stroke="#141420" stroke-width="0" />
