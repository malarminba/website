  <rect x="210" y="170" width="558" height="260" rx="4" fill="#0d0d18" stroke="#141420" stroke-width="1"/>
  <rect x="210" y="170" width="558" height="32" rx="4" fill="#0f0f1e"/>
  <text x="228" y="191" font-family="Inter,sans-serif" font-size="7" fill="#38384f" letter-spacing="1.5">REQUEST ID</text>
  <text x="358" y="191" font-family="Inter,sans-serif" font-size="7" fill="#38384f" letter-spacing="1.5">REQUESTER</text>
  <text x="498" y="191" font-family="Inter,sans-serif" font-size="7" fill="#38384f" letter-spacing="1.5">STATUS</text>
  <text x="628" y="191" font-family="Inter,sans-serif" font-size="7" fill="#38384f" letter-spacing="1.5">DATE</text>
