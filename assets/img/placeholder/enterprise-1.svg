  <text x="502" y="114" font-family="Inter,sans-serif" font-size="8" fill="#7070a0">Step 3</text>
  <text x="502" y="128" font-family="Inter,sans-serif" font-size="9" fill="#eeeaf8" font-weight="600">Approve</text>
