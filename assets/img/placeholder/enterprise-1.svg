  <text x="28" y="26" font-family="Inter,sans-serif" font-size="9" fill="#38384f" letter-spacing="2">ENTERPRISE WORKFLOW</text>
  <circle cx="758" cy="20" r="5" fill="#1a1030" stroke="#4c1d95" stroke-width="0.8"/>
  <!-- sidebar -->
  <rect x="0" y="41" width="180" height="459" fill="#08080c" stroke="#141420" stroke-width="0"/>
  <rect x="180" y="41" width="1" height="459" fill="#141420"/>
