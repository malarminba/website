  <rect x="452" y="124" width="24" height="24" rx="2" fill="#4c1d95"/>
  <rect x="484" y="124" width="24" height="24" rx="2" fill="#a855f7"/>
  <rect x="516" y="124" width="24" height="24" rx="2" fill="#c084fc"/>
  <rect x="548" y="124" width="24" height="24" rx="2" fill="#0d0d18"/>
  <rect x="580" y="124" width="24" height="24" rx="2" fill="#eeeaf8"/>
  <!-- type scale -->
  <text x="420" y="170" font-family="Inter,sans-serif" font-size="7" fill="#2a2a3e" letter-spacing="1">TYPE</text>
  <text x="420" y="188" font-family="Syne,Inter,sans-serif" font-size="16" fill="#eeeaf8" font-weight="700">Display Aa</text>
  <text x="420" y="204" font-family="Inter,sans-serif" font-size="11" fill="#c0c0e0">Body text Aa</text>
  <text x="420" y="218" font-family="Inter,sans-serif" font-size="8" fill="#7070a0" letter-spacing="2">CAPTION Aa</text>
  <!-- grid rule -->
  <line x1="420" y1="230" x2="756" y2="230" stroke="#141420" stroke-width="1"/>
  <!-- spacing guide -->
  <text x="420" y="252" font-family="Inter,sans-serif" font-size="7" fill="#2a2a3e" letter-spacing="1">SPACING SYSTEM</text>
  <rect x="420" y="260" width="4" height="4" rx="1" fill="#4c1d95"/>
  <rect x="432" y="260" width="8" height="8" rx="1" fill="#4c1d95"/>
  <rect x="448" y="260" width="16" height="16" rx="1" fill="#6d28d9"/>
  <rect x="472" y="260" width="24" height="24" rx="1" fill="#7c3aed" opacity="0.7" filter="url(#cg)"/>
  <rect x="504" y="260" width="32" height="32" rx="1" fill="#4c1d95" opacity="0.5"/>
  <text x="422" y="312" font-family="Inter,sans-serif" font-size="7" fill="#28283e">4px</text>
  <text x="432" y="312" font-family="Inter,sans-serif" font-size="7" fill="#28283e">8px</text>
  <text x="448" y="312" font-family="Inter,sans-serif" font-size="7" fill="#28283e">16px</text>
  <text x="474" y="312" font-family="Inter,sans-serif" font-size="7" fill="#28283e">24px</text>
  <text x="506" y="312" font-family="Inter,sans-serif" font-size="7" fill="#28283e">32px</text>
  <!-- bottom tag -->
  <text x="400" y="406" font-family="Inter,sans-serif" font-size="8" fill="#28283e" letter-spacing="1">Content System · Visual Language</text>
</svg>
