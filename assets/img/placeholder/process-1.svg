  <rect x="272" y="284" width="110" height="80" rx="2" fill="#0e0c18" stroke="#6d28d9" stroke-width="0.8" filter="url(#pg2)"/>
  <rect x="280" y="292" width="94" height="10" rx="1" fill="#1a1030"/>
  <rect x="280" y="308" width="35" height="46" rx="1" fill="#141428"/>
  <rect x="320" y="308" width="54" height="20" rx="1" fill="#1a1030"/>
  <rect x="320" y="334" width="54" height="20" rx="1" fill="#141428"/>
  <!-- wireframe 4 -->
  <rect x="394" y="284" width="110" height="80" rx="2" fill="#0a0a12" stroke="#1a1a28" stroke-width="1"/>
  <rect x="402" y="292" width="94" height="30" rx="1" fill="#111120"/>
  <rect x="402" y="328" width="42" height="6" rx="1" fill="#141420"/>
  <rect x="402" y="340" width="60" height="6" rx="1" fill="#141420"/>
