<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0c0c1a"/>
    </linearGradient>
    <filter id="pg2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#pbg)"/>
  <!-- header -->
  <rect x="0" y="0" width="800" height="40" fill="#06060e"/>
  <rect x="0" y="40" width="800" height="1" fill="#141420"/>
  <text x="28" y="25" font-family="Inter,sans-serif" font-size="9" fill="#38384f" letter-spacing="2">PROCESS · IDEATION TO SYSTEM</text>
  <!-- wireframe nodes connected by lines -->
  <!-- Node 1: Scatter -->
  <circle cx="80" cy="160" r="28" fill="#0d0d1a" stroke="#1e1e2e" stroke-width="1"/>
  <text x="80" y="155" font-family="Inter,sans-serif" font-size="7" fill="#38384f" text-anchor="middle">Scatter</text>
  <!-- small dots around it representing ideas -->
  <circle cx="52" cy="138" r="3" fill="#2a1050" stroke="#4c1d95" stroke-width="0.5"/>
  <circle cx="44" cy="160" r="2" fill="#2a1050"/>
  <circle cx="56" cy="182" r="2.5" fill="#2a1050"/>
  <circle cx="108" cy="140" r="2" fill="#2a1050"/>
  <circle cx="112" cy="174" r="3" fill="#2a1050" stroke="#4c1d95" stroke-width="0.5"/>
  <!-- connecting line -->
  <line x1="110" y1="160" x2="200" y2="160" stroke="#1e1e2e" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Node 2: Listen -->
  <circle cx="228" cy="160" r="28" fill="#0e0e1c" stroke="#2a1a40" stroke-width="1"/>
  <text x="228" y="155" font-family="Inter,sans-serif" font-size="7" fill="#5050a0" text-anchor="middle">Listen</text>
  <text x="228" y="167" font-family="Inter,sans-serif" font-size="6" fill="#38384f" text-anchor="middle">Gather</text>
  <!-- lines -->
  <line x1="258" y1="160" x2="350" y2="160" stroke="#1e1e2e" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Node 3: Filter (active/highlight) -->
  <circle cx="378" cy="160" r="32" fill="#110e1e" stroke="#6d28d9" stroke-width="1" filter="url(#pg2)"/>
  <text x="378" y="155" font-family="Inter,sans-serif" font-size="7" fill="#a855f7" text-anchor="middle">Filter</text>
  <text x="378" y="167" font-family="Inter,sans-serif" font-size="6" fill="#7c3aed" text-anchor="middle">Shape</text>
  <!-- radiant glow -->
  <circle cx="378" cy="160" r="44" fill="none" stroke="#4c1d95" stroke-width="0.5" opacity="0.4" filter="url(#pg2)"/>
  <line x1="412" y1="160" x2="498" y2="160" stroke="#1e1e2e" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Node 4: Structure -->
  <circle cx="526" cy="160" r="28" fill="#0d0d1a" stroke="#1e1e2e" stroke-width="1"/>
  <text x="526" y="155" font-family="Inter,sans-serif" font-size="7" fill="#38384f" text-anchor="middle">Structure</text>
  <text x="526" y="167" font-family="Inter,sans-serif" font-size="6" fill="#28283e" text-anchor="middle">Build</text>
  <line x1="556" y1="160" x2="648" y2="160" stroke="#1e1e2e" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Node 5: Voice -->
  <circle cx="676" cy="160" r="28" fill="#0d0d1a" stroke="#1e1e2e" stroke-width="1"/>
  <text x="676" y="155" font-family="Inter,sans-serif" font-size="7" fill="#38384f" text-anchor="middle">Voice</text>
  <text x="676" y="167" font-family="Inter,sans-serif" font-size="6" fill="#28283e" text-anchor="middle">Deliver</text>
  <line x1="676" y1="190" x2="676" y2="240" stroke="#1e1e2e" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- journey path arrow -->
  <path d="M 80 200 Q 378 230 676 200" fill="none" stroke="#2a1050" stroke-width="1" stroke-dasharray="5,4"/>
