  <rect x="150" y="284" width="110" height="80" rx="2" fill="#0a0a12" stroke="#1c1a28" stroke-width="1"/>
  <rect x="158" y="292" width="40" height="40" rx="1" fill="#141420"/>
  <rect x="206" y="292" width="46" height="8" rx="1" fill="#1a1a28"/>
  <rect x="206" y="306" width="36" height="6" rx="1" fill="#141420"/>
  <rect x="206" y="318" width="28" height="6" rx="1" fill="#141420"/>
