  <rect x="516" y="284" width="110" height="80" rx="2" fill="#0a0a12" stroke="#1a1a28" stroke-width="1"/>
  <circle cx="571" cy="320" r="22" fill="#0f0f1c" stroke="#1e1e2e" stroke-width="0.5"/>
  <circle cx="571" cy="320" r="12" fill="none" stroke="#2a1050" stroke-width="1"/>
  <circle cx="571" cy="320" r="4" fill="#1a1030" stroke="#4c1d95" stroke-width="0.5"/>
  <!-- label annotations -->
  <text x="400" y="404" font-family="Inter,sans-serif" font-size="8" fill="#28283e" text-anchor="middle" letter-spacing="1">From ideas to journeys · Minba Process</text>
  <text x="400" y="420" font-family="Inter,sans-serif" font-size="7" fill="#1e1e30" text-anchor="middle" letter-spacing="2">DESIGN THINKING · SYSTEMS APPROACH</text>
