  <circle cx="340" cy="364" r="6" fill="#0e0e1a" stroke="#1c1c2c" stroke-width="1"/>
  <circle cx="360" cy="364" r="6" fill="#0e0e1a" stroke="#1c1c2c" stroke-width="1"/>
  <circle cx="380" cy="364" r="6" fill="#120e20" stroke="#4c1d95" stroke-width="1" filter="url(#g2)"/>
  <!-- label -->
  <text x="610" y="270" font-family="Inter,sans-serif" font-size="11" fill="#2a2a3e" text-anchor="middle">Puzzle-led</text>
  <text x="610" y="286" font-family="Inter,sans-serif" font-size="11" fill="#2a2a3e" text-anchor="middle">Mobile Experience</text>
  <text x="610" y="308" font-family="Inter,sans-serif" font-size="8" fill="#1e1e30" text-anchor="middle" letter-spacing="2">PUDHIRPETTI</text>
</svg>
