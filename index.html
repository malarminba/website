<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minba — Voice out of Noise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════
       NAVIGATION
       ─────────────────────────────────────────────────── -->
  <nav class="nav" id="main-nav">
    <div class="nav-inner">

      <!--
        ╔══════════════════════════════════════════════════╗
        ║  BRAND MARK — TOP LEFT                           ║
        ║  ─────────────────────────────────────────────   ║
        ║  Currently: text wordmark "Minba"                ║
        ║                                                  ║
        ║  TO REPLACE WITH FINAL LOGO:                     ║
        ║  1. Remove the <span class="nav-brand-word">     ║
        ║  2. Add inside .nav-brand:                       ║
        ║                                                  ║
        ║    <img src="./assets/img/logo/minba-logo.svg"   ║
        ║         class="nav-brand-img"                    ║
        ║         alt="Minba"                              ║
        ║         width="88" height="22">                  ║
        ║                                                  ║
        ║  Expected: white wordmark SVG                    ║
        ║  Size: ~88px wide, 20–22px tall                  ║
        ║  Colour: var(--color-white) fill                 ║
        ╚══════════════════════════════════════════════════╝
      -->
      <a href="#noise" class="nav-brand" id="nav-brand" aria-label="Minba — return to top">
        <span class="nav-brand-word" id="nav-brand-word">Minba</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a class="nav-link" id="nav-signal" href="#signal"></a></li>
        <li><a class="nav-link" id="nav-method" href="#method"></a></li>
        <li><a class="nav-link" id="nav-proof"  href="#proof"></a></li>
        <li><a class="nav-link nav-email" id="nav-email"></a></li>
      </ul>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════
       SECTION 1 — NOISE
       Hero. Scattered particles. The noise before signal.
       ─────────────────────────────────────────────────── -->
  <section id="noise" class="section section--noise">
    <canvas id="hero-canvas" aria-hidden="true"></canvas>
    <div class="noise-content">
      <p class="noise-eyebrow" aria-hidden="true">—</p>
      <h1 class="noise-title" id="noise-title"></h1>
      <p class="noise-micro" id="noise-micro"></p>
    </div>
    <div class="scroll-indicator" aria-hidden="true">
      <div class="scroll-line-wrap"><div class="scroll-line"></div></div>
      <span class="scroll-label">scroll</span>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════
       SECTION 2 — SIGNAL
       Particles converge. The crystal/logo emerges.
       ─────────────────────────────────────────────────── -->
  <section id="signal" class="section section--signal">
    <div class="signal-inner">

      <div class="signal-left">
        <div class="signal-text-block">
          <span class="section-label">Signal</span>
          <h2 class="signal-title" id="signal-title"></h2>
          <p class="signal-body" id="signal-body"></p>
          <p class="signal-secondary" id="signal-secondary"></p>
        </div>
        <div class="signal-areas" id="signal-areas"></div>
      </div>

      <!-- Crystal element — right panel -->
      <div class="signal-right">
        <div class="star-container" id="star-container">

          <!--
            ╔════════════════════════════════════════════╗
            ║  INNER LOGO ELEMENT — SECTION 2            ║
            ║  ───────────────────────────────────────   ║
            ║  PLACEHOLDER: geometric crystal/star SVG   ║
            ║  representing the inner Minba logo mark.   ║
            ║                                            ║
            ║  TO REPLACE:                               ║
            ║  Swap the <svg> below with the final       ║
            ║  Minba crystal SVG. Keep these attributes: ║
            ║    class="star-crystal"                    ║
            ║    id="main-star"                          ║
            ║    aria-hidden="true"                      ║
            ║  GSAP uses #main-star for animation.       ║
            ║                                            ║
            ║  If using <img> instead of inline SVG,     ║
            ║  note that GSAP rotation will still work,  ║
            ║  but internal element tweens will not.     ║
            ╚════════════════════════════════════════════╝
          -->
          <svg class="star-crystal"
               id="main-star"
               viewBox="0 0 200 200"
               xmlns="http://www.w3.org/2000/svg"
               aria-hidden="true">
            <defs>

              <!-- Soft edge glow — used on outer lines -->
              <filter id="glow-soft" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <!-- Wider ambient glow — used on aura circle -->
              <filter id="glow-ambient" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="11" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <!-- Ambient aura — soft radial fill behind the crystal -->
              <radialGradient id="crystal-aura" cx="50%" cy="50%" r="50%">
                <stop offset="0%"   stop-color="#8b5cf6" stop-opacity="0.14"/>
                <stop offset="55%"  stop-color="#4c1d95" stop-opacity="0.06"/>
                <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
              </radialGradient>

              <!-- Main outer star stroke gradient -->
              <linearGradient id="star-line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.88"/>
                <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.50"/>
              </linearGradient>

            </defs>

            <!-- Ambient aura circle -->
            <circle cx="100" cy="100" r="90"
              fill="url(#crystal-aura)"
              filter="url(#glow-ambient)"/>

            <!--
              OUTER STAR — 6-pointed crystal outline
              Points: outer r=82, inner r=42, start at top (–90°)
              i=0:  (100,18)   outer top
              i=1:  (121,64)   inner top-right
              i=2:  (171,59)   outer right-top
              i=3:  (142,100)  inner right
              i=4:  (171,141)  outer right-bottom
              i=5:  (121,136)  inner bottom-right
              i=6:  (100,182)  outer bottom
              i=7:  (79,136)   inner bottom-left
              i=8:  (29,141)   outer left-bottom
              i=9:  (58,100)   inner left
              i=10: (29,59)    outer left-top
              i=11: (79,64)    inner top-left
            -->
            <polygon
              points="100,18 121,64 171,59 142,100 171,141 121,136 100,182 79,136 29,141 58,100 29,59 79,64"
              fill="none"
              stroke="url(#star-line-grad)"
              stroke-width="0.85"
              filter="url(#glow-soft)"
              opacity="0.82"/>

            <!-- Inner diamond — faceted crystal core -->
            <polygon
              points="100,50 150,100 100,150 50,100"
              fill="rgba(139,92,246,0.04)"
              stroke="#a78bfa"
              stroke-width="0.6"
              opacity="0.60"/>

            <!-- Radial axis lines — structural geometry -->
            <line x1="100" y1="18"  x2="100" y2="182" stroke="#8b5cf6" stroke-width="0.3" opacity="0.22"/>
            <line x1="29"  y1="59"  x2="171" y2="141" stroke="#8b5cf6" stroke-width="0.3" opacity="0.22"/>
            <line x1="171" y1="59"  x2="29"  y2="141" stroke="#8b5cf6" stroke-width="0.3" opacity="0.22"/>
            <line x1="29"  y1="100" x2="171" y2="100" stroke="#8b5cf6" stroke-width="0.3" opacity="0.22"/>

            <!--
              Upper facet highlights — lighter edge of the crystal
              These simulate the brightest face of a cut gem.
            -->
            <line x1="100" y1="50" x2="150" y2="100" stroke="#a78bfa" stroke-width="0.55" opacity="0.42"/>
            <line x1="100" y1="50" x2="50"  y2="100" stroke="#a78bfa" stroke-width="0.55" opacity="0.42"/>

            <!-- Lower facet — darker, depth -->
            <line x1="100" y1="150" x2="150" y2="100" stroke="#4c1d95" stroke-width="0.45" opacity="0.28"/>
            <line x1="100" y1="150" x2="50"  y2="100" stroke="#4c1d95" stroke-width="0.45" opacity="0.28"/>

            <!--
              CYAN HIGHLIGHT — single accent facet
              One subtle cyan line on the upper-left facet only.
              This is the optional highlight from the brief.
              Keep opacity very low (0.20–0.28 max).
              Remove if brand review decides against it.
            -->
            <line x1="79"  y1="64"  x2="100" y2="50"  stroke="#67e8f9" stroke-width="0.55" opacity="0.22"/>
            <line x1="100" y1="18"  x2="79"  y2="64"  stroke="#67e8f9" stroke-width="0.4"  opacity="0.14"/>

            <!-- Outer tip dots — vertices of the star -->
            <circle cx="100" cy="18"  r="1.4" fill="#a78bfa" opacity="0.70" filter="url(#glow-soft)"/>
            <circle cx="171" cy="59"  r="1.1" fill="#8b5cf6" opacity="0.50"/>
            <circle cx="171" cy="141" r="1.1" fill="#8b5cf6" opacity="0.50"/>
            <circle cx="100" cy="182" r="1.4" fill="#a78bfa" opacity="0.70" filter="url(#glow-soft)"/>
            <circle cx="29"  cy="141" r="1.1" fill="#8b5cf6" opacity="0.50"/>
            <circle cx="29"  cy="59"  r="1.1" fill="#8b5cf6" opacity="0.50"/>

            <!-- Centre point — always the brightest element -->
            <circle cx="100" cy="100" r="2.5" fill="#f4f0ff" filter="url(#glow-soft)" opacity="0.88"/>

          </svg>
          <!-- END INNER LOGO PLACEHOLDER — Section 2 -->

        </div>
      </div>

    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════
       SECTION 3 — METHOD
       Crystal shrinks, settles into the timeline line.
       ─────────────────────────────────────────────────── -->
  <section id="method" class="section section--method">
    <div class="method-inner">

      <div class="method-header">
        <span class="section-label">Method</span>
        <h2 class="method-title" id="method-title"></h2>
        <p class="method-body"  id="method-body"></p>
      </div>

      <div class="method-layout">

        <!-- Travelling crystal + vertical line column -->
        <div class="method-star-col">

          <!--
            ╔════════════════════════════════════════════╗
            ║  INNER LOGO ELEMENT — SECTION 3 (small)    ║
            ║  ───────────────────────────────────────   ║
            ║  PLACEHOLDER: reduced version of the       ║
            ║  crystal mark, sitting at the top of the   ║
            ║  method timeline line.                     ║
            ║                                            ║
            ║  TO REPLACE: swap the <svg> below with     ║
            ║  the final Minba crystal mark at small     ║
            ║  size. Keep class="star-crystal--sm".      ║
            ╚════════════════════════════════════════════╝
          -->
          <div class="method-star-wrap">
            <svg class="star-crystal star-crystal--sm"
                 viewBox="0 0 200 200"
                 xmlns="http://www.w3.org/2000/svg"
                 aria-hidden="true">
              <defs>
                <filter id="glow-m" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="5" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
                <radialGradient id="aura-m" cx="50%" cy="50%" r="50%">
                  <stop offset="0%"   stop-color="#8b5cf6" stop-opacity="0.13"/>
                  <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <circle cx="100" cy="100" r="88"
                fill="url(#aura-m)" filter="url(#glow-m)"/>
              <polygon
                points="100,18 121,64 171,59 142,100 171,141 121,136 100,182 79,136 29,141 58,100 29,59 79,64"
                fill="none" stroke="#6d28d9" stroke-width="0.75" opacity="0.52"/>
              <polygon
                points="100,50 150,100 100,150 50,100"
                fill="none" stroke="#8b5cf6" stroke-width="0.55" opacity="0.38"/>
              <line x1="100" y1="18"  x2="100" y2="182" stroke="#4c1d95" stroke-width="0.3" opacity="0.22"/>
              <line x1="29"  y1="59"  x2="171" y2="141" stroke="#4c1d95" stroke-width="0.3" opacity="0.22"/>
              <line x1="171" y1="59"  x2="29"  y2="141" stroke="#4c1d95" stroke-width="0.3" opacity="0.22"/>
              <!-- Tiny cyan hint on same upper-left facet -->
              <line x1="79"  y1="64"  x2="100" y2="50"  stroke="#67e8f9" stroke-width="0.5" opacity="0.18"/>
              <circle cx="100" cy="100" r="2.2"
                fill="#a78bfa" filter="url(#glow-m)" opacity="0.78"/>
            </svg>
          </div>
          <!-- END INNER LOGO PLACEHOLDER — Section 3 -->

          <div class="method-center-line">
            <div class="method-line-fill" id="method-line-fill"></div>
          </div>
        </div>

        <div class="method-steps" id="method-steps"></div>
      </div>

    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════
       SECTION 4 — PROOF
       Work evidence. Category-filtered fly-in cards.
       ─────────────────────────────────────────────────── -->
  <section id="proof" class="section section--proof">
    <div class="proof-inner">
      <div class="proof-header">
        <span class="section-label">Proof</span>
        <h2 class="proof-title"    id="proof-title"></h2>
        <p  class="proof-subtitle" id="proof-subtitle"></p>
      </div>
      <div class="proof-layout">
        <aside class="proof-sidebar">
          <ul class="proof-cats" id="proof-cats"></ul>
        </aside>
        <div class="proof-stage" id="proof-stage"></div>
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════
       SECTION 5 — CONTACT
       Crystal returns, resolved. Quiet close.
       ─────────────────────────────────────────────────── -->
  <section id="contact" class="section section--contact">

    <!-- Background crystal — large, very dim, resolved state -->
    <div class="contact-star-bg" aria-hidden="true">

      <!--
        ╔════════════════════════════════════════════════╗
        ║  INNER LOGO ELEMENT — SECTION 5 (bg, large)   ║
        ║  ────────────────────────────────────────────  ║
        ║  PLACEHOLDER: oversized background crystal,   ║
        ║  opacity ~0.35, representing the resolved      ║
        ║  final state of the signal journey.            ║
        ║                                                ║
        ║  TO REPLACE: swap with final Minba crystal     ║
        ║  SVG. Keep class="star-crystal--contact".      ║
        ║  Parent .contact-star-bg controls size/pos.   ║
        ╚════════════════════════════════════════════════╝
      -->
      <svg class="star-crystal star-crystal--contact"
           viewBox="0 0 200 200"
           xmlns="http://www.w3.org/2000/svg"
           aria-hidden="true">
        <defs>
          <filter id="glow-c" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="16" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <radialGradient id="aura-c" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#8b5cf6" stop-opacity="0.11"/>
            <stop offset="65%"  stop-color="#4c1d95" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <circle cx="100" cy="100" r="94"
          fill="url(#aura-c)" filter="url(#glow-c)"/>
        <polygon
          points="100,18 121,64 171,59 142,100 171,141 121,136 100,182 79,136 29,141 58,100 29,59 79,64"
          fill="none" stroke="#6d28d9" stroke-width="0.65" opacity="0.40"/>
        <polygon
          points="100,50 150,100 100,150 50,100"
          fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.28"/>
        <line x1="100" y1="18"  x2="100" y2="182" stroke="#4c1d95" stroke-width="0.28" opacity="0.18"/>
        <line x1="29"  y1="59"  x2="171" y2="141" stroke="#4c1d95" stroke-width="0.28" opacity="0.18"/>
        <line x1="171" y1="59"  x2="29"  y2="141" stroke="#4c1d95" stroke-width="0.28" opacity="0.18"/>
        <!-- Cyan accent — single upper-left facet, very faint at this scale -->
        <line x1="79"  y1="64"  x2="100" y2="50"  stroke="#67e8f9" stroke-width="0.5" opacity="0.16"/>
        <circle cx="100" cy="100" r="2.8"
          fill="#a78bfa" filter="url(#glow-c)" opacity="0.82"/>
      </svg>
      <!-- END INNER LOGO PLACEHOLDER — Section 5 -->

    </div>

    <div class="contact-inner">
      <span class="section-label">Contact</span>
      <h2 class="contact-title" id="contact-title"></h2>
      <p  class="contact-body"  id="contact-body"></p>
      <a  class="contact-cta"   id="contact-cta"></a>
    </div>

    <footer class="footer">
      <span class="footer-brand" id="footer-brand"></span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span class="footer-line"  id="footer-line"></span>
    </footer>

  </section>

  <!-- GSAP core + plugins (CDN — must load before content.js and main.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>

  <!-- Site content (edit here for all copy/data) — must load before main.js -->
  <script src="./assets/js/content.js"></script>

  <!-- Animation + interaction logic -->
  <script src="./assets/js/main.js"></script>
</body>
</html>
